name: Monthly portfolio maintenance

on:
  schedule:
    - cron: "17 16 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run maintenance checks
        id: checks
        continue-on-error: true
        shell: bash
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: |
          set +e
          {
            echo "# Monthly portfolio maintenance report"
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Repository and publication boundary"
            python scripts/portfolio.py validate
            validation_status=$?
            echo
            echo "## Review dates"
            python scripts/portfolio.py review-dates
            review_status=$?
            echo
            echo "## External links"
            python scripts/portfolio.py links --external
            link_status=$?
          } > maintenance-report.md 2>&1

          if (( validation_status != 0 || review_status != 0 || link_status != 0 )); then
            exit 1
          fi

      - name: Open or update maintenance issue
        if: steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Portfolio maintenance review required"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file maintenance-report.md
          else
            gh issue create --title "$title" --body-file maintenance-report.md
          fi

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-maintenance-report
          path: maintenance-report.md
          if-no-files-found: error
          retention-days: 30
