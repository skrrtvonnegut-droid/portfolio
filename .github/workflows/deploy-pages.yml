name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install .

      - name: Validate public boundary
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: |
          python -m scripts.build_resume --check
          python -m scripts.validate_frontmatter docs
          python -m scripts.scan_public_content
          python -m scripts.build_artifact_index --check
          python -m scripts.check_review_dates

      - name: Build
        run: zensical build --clean --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
