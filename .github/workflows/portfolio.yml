name: Portfolio CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate artifacts and privacy boundary
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: python scripts/portfolio.py validate

      - name: Check artifact review dates
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: python scripts/portfolio.py review-dates

      - name: Check public external links
        run: python scripts/portfolio.py links --external

      - name: Lint Python
        run: ruff check scripts tests

      - name: Run publication-boundary tests
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: python -m unittest discover -s tests

      - name: Build Zensical site strictly
        run: zensical build --clean --strict

      - name: Generate machine-readable catalog
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: python scripts/portfolio.py catalog --output site/catalog.json

      - name: Upload site preview
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, secrets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate publication boundary
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: |
          python scripts/portfolio.py validate
          python scripts/portfolio.py review-dates

      - name: Build deployable site strictly
        run: zensical build --clean --strict

      - name: Generate machine-readable catalog
        env:
          PORTFOLIO_DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: python scripts/portfolio.py catalog --output site/catalog.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
