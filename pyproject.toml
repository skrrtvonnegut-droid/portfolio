[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "portfolio_common",
  "portfolio_links",
  "portfolio_security",
  "portfolio_validate",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
